<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词检测 - 测试界面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1b2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ========== 顶部信息栏 ========== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    font-size: 13px;
    border-bottom: 1px solid #2a2b3e;
    flex-shrink: 0;
    gap: 12px;
  }
  .top-bar .title { flex-shrink: 0; }
  .top-bar .title .progress { opacity: 0.6; margin-left: 8px; }
  .top-bar .center-controls { flex: 1; display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 11px; opacity: 0.8; }
  .top-bar .center-controls label { display: flex; align-items: center; gap: 4px; }
  .top-bar .center-controls input[type="range"] { width: 80px; vertical-align: middle; accent-color: #7c5cfc; }
  .top-bar .center-controls .val { min-width: 36px; }
  .top-bar .answered-count { opacity: 0.6; flex-shrink: 0; }

  /* ========== 主区域 ========== */
  .quiz-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* 题目卡片 */
  .question-card {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 500px;
    height: 130px;
    padding: 20px 32px;
    background: #252840;
    border: 1px solid #3a3d5c;
    border-radius: 10px;
    text-align: center;
    box-sizing: border-box;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .question-card .type-label { font-size: 11px; color: #e0e0e0; opacity: 0.5; margin-bottom: 8px; text-transform: uppercase; }
  .question-card .word { font-size: 22px; font-weight: 600; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .question-card .hint { font-size: 13px; opacity: 0.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ========== 选项按钮 ========== */
  .option-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 210px;
    height: 52px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    z-index: 1;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
  }
  .option-btn-inner {
    width: 100%; height: 100%;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #3a3d5c;
    background: #252840;
    color: #e0e0e0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    overflow: hidden;
  }
  .option-btn .opt-label { font-weight: 700; margin-right: 8px; flex-shrink: 0; }
  .option-btn .opt-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .option-btn.wrong .option-btn-inner { background: #7a1f1f; border-color: #f44336; color: #fff; }
  .option-btn.correct .option-btn-inner { background: #1a6b3c; border-color: #4caf50; color: #fff; }
  .option-btn.show-correct .option-btn-inner { background: #1a6b3c; border-color: #4caf50; color: #fff; }
  .option-btn.disabled { cursor: default; }

  /* ========== 翻转态：选项缩小淡出 ========== */
  .quiz-area.flipped .option-btn {
    transform: translate(-50%, -50%) scale(0.3) !important;
    opacity: 0 !important;
    pointer-events: none;
  }
  .quiz-area.flipped .question-card {
    opacity: 0.15;
  }

  /* ========== 翻转详情卡片 ========== */
  .flip-card {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    max-width: 88%;
    z-index: 101;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    display: none;
  }
  .quiz-area.flipped .flip-card {
    display: block;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .flip-card-inner {
    background: linear-gradient(135deg, #252840, #1e2140);
    border: 1px solid rgba(124, 92, 252, 0.3);
    border-radius: 20px;
    padding: 40px 36px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .flip-card-inner .fc-type { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; opacity: 0.5; margin-bottom: 12px; }
  .flip-card-inner .fc-word { font-size: 36px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .flip-card-inner .fc-phonetic { font-size: 16px; opacity: 0.6; font-family: 'Times New Roman', serif; margin-bottom: 16px; }
  .flip-card-inner .fc-divider { width: 60px; height: 3px; background: linear-gradient(90deg, transparent, #7c5cfc, transparent); border-radius: 2px; margin: 0 auto 20px; }
  .flip-card-inner .fc-def { font-size: 20px; font-weight: 500; color: #b0a8ff; line-height: 1.4; margin-bottom: 16px; }
  .flip-card-inner .fc-example { font-size: 15px; opacity: 0.7; font-style: italic; margin-bottom: 20px; line-height: 1.5; }
  .flip-card-inner .fc-stage { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
  .flip-card-inner .fc-stage .fc-stage-lbl { opacity: 0.5; }
  .flip-card-inner .fc-stage .fc-stage-badge { padding: 4px 14px; border-radius: 20px; background: rgba(124,92,252,0.15); border: 1px solid rgba(124,92,252,0.3); color: #b0a8ff; font-weight: 600; }
  .flip-card-inner .fc-hint { font-size: 11px; opacity: 0.25; letter-spacing: 1px; }

  /* ========== 背面遮罩 ========== */
  .flip-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.01);
    z-index: 99;
    display: none;
    cursor: pointer;
  }
  .quiz-area.flipped .flip-overlay { display: block; }

  /* ========== 底部工具栏 ========== */
  .bottom-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid #2a2b3e;
    background: #1e1f35;
    flex-shrink: 0;
  }
  .bottom-bar button { padding: 6px 16px; font-size: 13px; border: 1px solid #2a2b3e; border-radius: 4px; background: transparent; color: #e0e0e0; cursor: pointer; }
  .bottom-bar button:hover:not(:disabled) { background: #2a2b3e; }
  .bottom-bar button:disabled { opacity: 0.5; cursor: not-allowed; background: #1a1b2e; border-color: #2a2b3e; }

  .shortcut-hint { padding: 4px 16px; font-size: 11px; opacity: 0.4; text-align: center; flex-shrink: 0; }

  /* ========== 完成界面 ========== */
  .complete-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .complete-screen .celebration { font-size: 48px; }
  .complete-screen .complete-title { font-size: 20px; font-weight: 600; }
  .complete-screen .complete-summary { font-size: 14px; opacity: 0.7; }
  .complete-screen .view-result-btn { padding: 10px 32px; font-size: 16px; border: none; border-radius: 6px; background: #7c5cfc; color: #fff; cursor: pointer; }
  .complete-screen .view-result-btn:hover { background: #6a4ae0; }
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <span class="title">
    单词检测
    <span class="progress" id="progressLabel">1/8</span>
  </span>
  <div class="center-controls">
    <label>阻尼
      <input type="range" min="0.99" max="1" step="0.0005" value="0.9985" id="dampingSlider">
      <span class="val" id="dampingVal">0.9985</span>
    </label>
    <label>冲量
      <input type="range" min="1" max="20" step="1" value="8" id="impulseSlider">
      <span class="val" id="impulseVal">8</span>
    </label>
  </div>
  <span class="answered-count" id="answeredCount">已答: 0/8</span>
</div>

<div class="quiz-area" id="quizArea">
  <div class="question-card" id="questionCard">
    <div class="type-label" id="qType">WORD TO MEANING</div>
    <div class="word" id="qWord">abandon</div>
    <div class="hint" id="qHint">选择正确的释义</div>
  </div>

  <!-- 翻转详情卡片 -->
  <div class="flip-card" id="flipCard">
    <div class="flip-card-inner">
      <div class="fc-type" id="fcType">WORD → MEANING</div>
      <div class="fc-word" id="fcWord">abandon</div>
      <div class="fc-phonetic" id="fcPhonetic">/əˈbændən/</div>
      <div class="fc-divider"></div>
      <div class="fc-def" id="fcDef">v. 放弃，遗弃；n. 放任</div>
      <div class="fc-example" id="fcExample">"He abandoned his family for a life abroad."</div>
      <div class="fc-stage">
        <span class="fc-stage-lbl">艾宾浩斯·</span>
        <span class="fc-stage-badge" id="fcStageBadge">第 3 阶段</span>
        <span class="fc-stage-lbl" id="fcStageLabel">巩固中</span>
      </div>
      <div class="fc-hint">点击空白区域翻回原位</div>
    </div>
  </div>

  <div class="flip-overlay" id="flipOverlay"></div>
</div>

<div class="bottom-bar" id="bottomBar">
  <button id="exitBtn">退出</button>
  <button id="prevBtn">上一题</button>
  <button id="gatherBtn">集合</button>
  <button id="nextBtn">下一题</button>
</div>

<div class="shortcut-hint">
  键盘: 1/2/3/4 选择 · 方向键/空格 导航 · Ctrl+Tab 切换集合/浮动 · 答题后双击翻转查看详情
</div>

<script>
const TEST_QUESTIONS = [
  { id:1, type:'word-to-meaning', wordId:101, word:'abandon', phonetic:"/əˈbændən/", definition:"v. 放弃，遗弃；n. 放任", example:"He abandoned his family for a life abroad.", stage:3, correctAnswer:'B',
    options:[ {id:'A',text:'接受, 承认',pairText:'accept'}, {id:'B',text:'放弃, 遗弃',pairText:'abandon'}, {id:'C',text:'吸收, 吸引',pairText:'absorb'}, {id:'D',text:'获得, 达到',pairText:'achieve'} ] },
  { id:2, type:'meaning-to-word', wordId:101, word:'v. 放弃, 遗弃', phonetic:"/əˈbændən/", definition:"v. 放弃，遗弃；n. 放任", example:"He abandoned his family for a life abroad.", stage:3, correctAnswer:'C',
    options:[ {id:'A',text:'accept',pairText:'接受'}, {id:'B',text:'absorb',pairText:'吸收'}, {id:'C',text:'abandon',pairText:'放弃'}, {id:'D',text:'achieve',pairText:'达到'} ] },
  { id:3, type:'word-to-meaning', wordId:102, word:'brilliant', phonetic:"/ˈbrɪliənt/", definition:"adj. 辉煌的，明亮的；杰出的", example:"She had a brilliant idea during the meeting.", stage:2, correctAnswer:'A',
    options:[ {id:'A',text:'辉煌的, 明亮的',pairText:'brilliant'}, {id:'B',text:'沉闷的, 单调的',pairText:'boring'}, {id:'C',text:'脆弱的, 易碎的',pairText:'brittle'}, {id:'D',text:'宽阔的, 广阔的',pairText:'broad'} ] },
  { id:4, type:'meaning-to-word', wordId:102, word:'adj. 辉煌的, 明亮的', phonetic:"/ˈbrɪliənt/", definition:"adj. 辉煌的，明亮的；杰出的", example:"She had a brilliant idea during the meeting.", stage:2, correctAnswer:'D',
    options:[ {id:'A',text:'boring',pairText:'无聊的'}, {id:'B',text:'brittle',pairText:'易碎的'}, {id:'C',text:'broad',pairText:'广阔的'}, {id:'D',text:'brilliant',pairText:'辉煌的'} ] },
  { id:5, type:'word-to-meaning', wordId:103, word:'consequence', phonetic:"/ˈkɒnsɪkwəns/", definition:"n. 结果，后果；重要性", example:"The consequence of his actions was severe.", stage:4, correctAnswer:'C',
    options:[ {id:'A',text:'意识, 自觉',pairText:'consciousness'}, {id:'B',text:'保守的, 守旧的',pairText:'conservative'}, {id:'C',text:'结果, 后果',pairText:'consequence'}, {id:'D',text:'考虑, 体谅',pairText:'consideration'} ] },
  { id:6, type:'meaning-to-word', wordId:103, word:'n. 结果, 后果', phonetic:"/ˈkɒnsɪkwəns/", definition:"n. 结果，后果；重要性", example:"The consequence of his actions was severe.", stage:4, correctAnswer:'B',
    options:[ {id:'A',text:'consciousness',pairText:'意识'}, {id:'B',text:'consequence',pairText:'后果'}, {id:'C',text:'conservative',pairText:'保守的'}, {id:'D',text:'consideration',pairText:'考虑'} ] },
  { id:7, type:'word-to-meaning', wordId:104, word:'phenomenon', phonetic:"/fɪˈnɒmɪnən/", definition:"n. 现象，奇迹；非凡的人", example:"The northern lights are a natural phenomenon.", stage:1, correctAnswer:'D',
    options:[ {id:'A',text:'哲学, 人生观',pairText:'philosophy'}, {id:'B',text:'物理的, 物质的',pairText:'physical'}, {id:'C',text:'飞行员, 领航员',pairText:'pilot'}, {id:'D',text:'现象, 奇迹',pairText:'phenomenon'} ] },
  { id:8, type:'meaning-to-word', wordId:104, word:'n. 现象, 奇迹', phonetic:"/fɪˈnɒmɪnən/", definition:"n. 现象，奇迹；非凡的人", example:"The northern lights are a natural phenomenon.", stage:1, correctAnswer:'A',
    options:[ {id:'A',text:'phenomenon',pairText:'现象'}, {id:'B',text:'philosophy',pairText:'哲学'}, {id:'C',text:'physical',pairText:'物理的'}, {id:'D',text:'pilot',pairText:'飞行员'} ] },
]

const STAGE_LABELS = ['未学习', '初学者', '复习中', '巩固中', '熟练', '已掌握']

const state = {
  questions: TEST_QUESTIONS,
  currentIndex: 0,
  answers: {},
  answeredSet: {},
  isComplete: false,
  gather: true,
  isFlipped: false,
}

const quizArea = document.getElementById('quizArea')
const qType = document.getElementById('qType')
const qWord = document.getElementById('qWord')
const qHint = document.getElementById('qHint')
const progressLabel = document.getElementById('progressLabel')
const answeredCount = document.getElementById('answeredCount')
const dampingSlider = document.getElementById('dampingSlider')
const dampingVal = document.getElementById('dampingVal')
const impulseSlider = document.getElementById('impulseSlider')
const impulseVal = document.getElementById('impulseVal')
const flipOverlay = document.getElementById('flipOverlay')
const flipCard = document.getElementById('flipCard')
const fcType = document.getElementById('fcType')
const fcWord = document.getElementById('fcWord')
const fcPhonetic = document.getElementById('fcPhonetic')
const fcDef = document.getElementById('fcDef')
const fcExample = document.getElementById('fcExample')
const fcStageBadge = document.getElementById('fcStageBadge')
const fcStageLabel = document.getElementById('fcStageLabel')

const OPTION_W = 210, OPTION_H = 52, CARD_W = 500, CARD_H = 130
let damping = 0.9985, impulse = 8

dampingSlider.addEventListener('input', () => { damping=Number(dampingSlider.value); dampingVal.textContent=damping.toFixed(4) })
impulseSlider.addEventListener('input', () => { impulse=Number(impulseSlider.value); impulseVal.textContent=impulse })

let bodies = [], offsets = [], animFrameId = null

function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  const dx=ax-bx, dy=ay-by, ox=(aw+bw)/2-Math.abs(dx), oy=(ah+bh)/2-Math.abs(dy)
  if (ox<=0||oy<=0) return [false,0,0]
  return ox<oy ? [true,Math.sign(dx)*ox,0] : [true,0,Math.sign(dy)*oy]
}

function initPhysics(question) {
  const base=[{x:-130,y:40},{x:130,y:40},{x:-130,y:140},{x:130,y:140}]
  const ex=bodies
  bodies=question.options.map((_,i)=>{
    const bp=base[i],p=ex[i]
    return { x:p?p.x:bp.x, y:p?p.y:bp.y, vx:p?p.vx+(Math.random()-0.5)*impulse*2:(Math.random()-0.5)*impulse*2, vy:p?p.vy+(Math.random()-0.5)*impulse*2:(Math.random()-0.5)*impulse*2, targetX:bp.x, targetY:bp.y, phaseX:Math.random()*Math.PI*2, phaseY:Math.random()*Math.PI*2 }
  })
  offsets=bodies.map(b=>({x:b.x,y:b.y}))
}

function startPhysics() {
  if(animFrameId) cancelAnimationFrame(animFrameId)
  let last=performance.now()
  const tick=(now)=>{
    const dt=Math.min((now-last)/16,3);last=now
    const r=quizArea.getBoundingClientRect(), halfW=r.width/2, halfH=r.height/2
    const cardY=-halfH+CARD_H/2
    for(const b of bodies) {
      if(state.gather) { const dx=b.targetX-b.x, dy=b.targetY-b.y; b.vx+=dx*0.08*dt; b.vy+=dy*0.08*dt; b.vx*=0.9; b.vy*=0.9 }
      b.vx*=damping; b.vy*=damping; b.x+=b.vx*dt; b.y+=b.vy*dt
      const minX=-halfW+OPTION_W/2, maxX=halfW-OPTION_W/2, minY=-halfH+OPTION_H/2, maxY=halfH-OPTION_H/2
      if(b.x<minX){b.x=minX;b.vx=-b.vx*0.6} if(b.x>maxX){b.x=maxX;b.vx=-b.vx*0.6} if(b.y<minY){b.y=minY;b.vy=-b.vy*0.6} if(b.y>maxY){b.y=maxY;b.vy=-b.vy*0.6}
    }
    for(const b of bodies) {
      const [h,px,py]=overlap(b.x,b.y,OPTION_W,OPTION_H,0,cardY,CARD_W,CARD_H)
      if(h){b.x+=px;b.y+=py;if(px!==0)b.vx=-b.vx*0.5;if(py!==0)b.vy=-b.vy*0.5}
    }
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++) {
      const a=bodies[i],b=bodies[j]
      const [h,px,py]=overlap(a.x,a.y,OPTION_W,OPTION_H,b.x,b.y,OPTION_W,OPTION_H)
      if(h){a.x+=px/2;a.y+=py/2;b.x-=px/2;b.y-=py/2;if(px!==0){a.vx=-a.vx*0.5;b.vx=-b.vx*0.5}if(py!==0){a.vy=-a.vy*0.5;b.vy=-b.vy*0.5}}
    }
    offsets=bodies.map(b=>({x:b.x,y:b.y}))
    if(!state.isFlipped) updateOptionPositions()
    animFrameId=requestAnimationFrame(tick)
  }
  animFrameId=requestAnimationFrame(tick)
}

function renderQuestion() {
  if(state.isComplete){renderComplete();return}
  if(state.isFlipped) flipToFront()
  const q=state.questions[state.currentIndex]; if(!q) return
  qType.textContent=q.type==='word-to-meaning'?'WORD TO MEANING':'MEANING TO WORD'
  qWord.textContent=q.word
  qHint.textContent=q.type==='word-to-meaning'?'选择正确的释义':'选择正确的单词'
  const total=state.questions.length
  progressLabel.textContent=`${state.currentIndex+1}/${total}`
  answeredCount.textContent=`已答: ${Object.keys(state.answeredSet).length}/${total}`
  document.getElementById('prevBtn').disabled=state.currentIndex===0
  document.getElementById('nextBtn').disabled=state.currentIndex>=total-1||!q.answered
  initPhysics(q)
  renderOptionButtons(q)
  updateOptionPositions()
}

function renderOptionButtons(q) {
  document.querySelectorAll('.option-btn').forEach(el=>el.remove())
  quizArea.classList.remove('flipped')
  q.options.forEach((opt)=>{
    const btn=document.createElement('button'); btn.className='option-btn'; btn.dataset.optionId=opt.id
    const sel=q.answered, isSel=sel===opt.id, isCor=isSel&&opt.id===q.correctAnswer, isWr=isSel&&opt.id!==q.correctAnswer, shCor=sel&&opt.id===q.correctAnswer&&!isSel
    if(isWr) btn.classList.add('wrong','disabled')
    else if(isCor||shCor) btn.classList.add('correct','disabled')
    else if(isSel) btn.classList.add('disabled')
    if(q.answered) btn.classList.add('disabled')
    btn.innerHTML=`<div class="option-btn-inner"><span class="opt-label">${opt.id}.</span><span class="opt-text">${opt.text}</span></div>`
    const ft=btn.querySelector('.opt-text')
    btn.addEventListener('mouseenter',()=>{if(q.answered)ft.textContent=opt.pairText})
    btn.addEventListener('mouseleave',()=>{if(q.answered)ft.textContent=opt.text})
    btn.addEventListener('click',()=>{if(!q.answered)handleAnswer(opt.id)})
    quizArea.appendChild(btn)
  })
}

function updateOptionPositions() {
  document.querySelectorAll('.option-btn').forEach((btn,i)=>{const o=offsets[i];if(o)btn.style.transform=`translate(calc(-50% + ${o.x}px), calc(-50% + ${o.y}px))`})
}

let localAnswered=false
function handleAnswer(oid) {
  const q=state.questions[state.currentIndex]; if(!q||q.answered||localAnswered) return
  localAnswered=true; q.answered=oid; state.answers[q.id]=oid; state.answeredSet[q.id]=true
  if(Object.keys(state.answeredSet).length>=state.questions.length) state.isComplete=true
  renderQuestion(); setTimeout(()=>{localAnswered=false},100)
}

// =========== 翻转：选项缩小淡出 + 独立卡片 ===========
function flipToBack() {
  const q=state.questions[state.currentIndex]
  if(!q||!q.answered||state.isComplete) return
  if(animFrameId){cancelAnimationFrame(animFrameId);animFrameId=null}

  const correctOpt=q.options.find(o=>o.id===q.correctAnswer)
  const cleanWord=q.type==='word-to-meaning'?q.word:(correctOpt?correctOpt.text:q.word)
  const stageLabel=STAGE_LABELS[q.stage]||'未知'

  fcType.textContent=q.type==='word-to-meaning'?'WORD → MEANING':'MEANING → WORD'
  fcWord.textContent=cleanWord
  fcPhonetic.textContent=q.phonetic||''
  fcDef.textContent=q.definition||''
  fcExample.textContent=q.example?'"'+q.example+'"':''
  fcStageBadge.textContent=`第 ${q.stage} 阶段`
  fcStageLabel.textContent=stageLabel

  state.isFlipped=true
  quizArea.classList.add('flipped')
}

function flipToFront() {
  if(!state.isFlipped) return
  state.isFlipped=false
  quizArea.classList.remove('flipped')
  document.querySelectorAll('.option-btn').forEach(btn=>{
    const oid=btn.dataset.optionId
    // restore original transforms
  })
  // restore physics transforms from saved state
  setTimeout(()=>{if(!state.isFlipped) startPhysics()},600)
}

quizArea.addEventListener('dblclick',()=>{if(!state.isFlipped) flipToBack()})
flipOverlay.addEventListener('click',()=>{flipToFront()})
document.addEventListener('keydown',(e)=>{
  if(e.key==='f'||e.key==='F'){e.preventDefault();if(state.isFlipped)flipToFront();else flipToBack()}
})

// =========== 完成界面 ===========
function renderComplete() {
  document.querySelectorAll('.option-btn').forEach(el=>el.remove())
  document.getElementById('questionCard').style.display='none'
  if(state.isFlipped) flipToFront()
  const total=state.questions.length, correctCount=state.questions.filter(q=>q.answered===q.correctAnswer).length
  const screen=document.createElement('div'); screen.className='complete-screen'
  screen.innerHTML=`<div class="celebration">🎉</div><div class="complete-title">检测完成!</div><div class="complete-summary">共 ${total} 题 · 正确 ${correctCount} 题 · 错误 ${total-correctCount} 题 · 正确率 ${Math.round(correctCount/total*100)}%</div><button class="view-result-btn" id="retryBtn">重新检测</button>`
  quizArea.appendChild(screen)
  document.getElementById('retryBtn').addEventListener('click',resetQuiz)
  document.getElementById('bottomBar').style.display='none'
  document.querySelector('.shortcut-hint').style.display='none'
}

function resetQuiz() {
  state.currentIndex=0;state.answers={};state.answeredSet={};state.isComplete=false
  state.questions.forEach(q=>{q.answered=undefined})
  document.querySelectorAll('.complete-screen').forEach(el=>el.remove())
  document.getElementById('questionCard').style.display=''
  document.getElementById('bottomBar').style.display=''
  document.querySelector('.shortcut-hint').style.display=''
  renderQuestion()
}

function goPrev(){if(state.isFlipped)flipToFront();if(state.currentIndex>0){state.currentIndex--;renderQuestion()}}
function goNext(){const q=state.questions[state.currentIndex];if(q&&q.answered&&state.currentIndex<state.questions.length-1){if(state.isFlipped)flipToFront();state.currentIndex++;renderQuestion()}}

document.getElementById('prevBtn').addEventListener('click',goPrev)
document.getElementById('nextBtn').addEventListener('click',goNext)
document.getElementById('gatherBtn').addEventListener('click',()=>{state.gather=!state.gather;document.getElementById('gatherBtn').textContent=state.gather?'浮动':'集合'})
document.getElementById('exitBtn').addEventListener('click',()=>{if(confirm('确定退出？'))resetQuiz()})

// =========== 键盘 ===========
let longPressTimer=null
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return
  if(e.key==='f'||e.key==='F'){e.preventDefault();if(state.isFlipped)flipToFront();else flipToBack();return}
  const map={'1':'A','2':'B','3':'C','4':'D'}, optId=map[e.key]
  if(optId){const q=state.questions[state.currentIndex];if(!q)return;if(q.answered){if(longPressTimer)clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{const b=document.querySelector(`.option-btn[data-option-id="${optId}"]`);if(b)b.querySelector('.opt-text').textContent=q.options.find(o=>o.id===optId)?.pairText||''},300)}else handleAnswer(optId);return}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(state.isFlipped)flipToFront();if(state.currentIndex>0){state.currentIndex--;renderQuestion()}}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='Enter'){if(state.isFlipped)flipToFront();const q=state.questions[state.currentIndex];if(q&&q.answered&&state.currentIndex<state.questions.length-1){state.currentIndex++;renderQuestion()}}
  else if(e.key===' '){e.preventDefault();if(state.isFlipped)flipToFront();const q=state.questions[state.currentIndex];if(q&&q.answered&&state.currentIndex<state.questions.length-1){state.currentIndex++;renderQuestion()}}
  else if((e.ctrlKey||e.metaKey)&&e.key==='Tab'){e.preventDefault();state.gather=!state.gather;document.getElementById('gatherBtn').textContent=state.gather?'浮动':'集合'}
})
document.addEventListener('keyup',(e)=>{
  if(['1','2','3','4'].includes(e.key)){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}const q=state.questions[state.currentIndex];if(q&&q.answered){document.querySelectorAll('.option-btn').forEach(btn=>{const oid=btn.dataset.optionId,opt=q.options.find(o=>o.id===oid);if(opt)btn.querySelector('.opt-text').textContent=opt.text})}}
})

renderQuestion()
startPhysics()
let resizeTimer
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(animFrameId)cancelAnimationFrame(animFrameId);startPhysics()},200)})
</script>
</body>
</html>
